name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Test and build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: Test Unix
        if: runner.os != 'Windows'
        run: go test ./...

      - name: Test Windows core
        if: runner.os == 'Windows'
        run: >
          go test -timeout 5m
          ./internal/config
          ./internal/converter
          ./internal/dhcphelper
          ./internal/firmware
          ./internal/inventory
          ./internal/parser
          ./internal/platform
          ./internal/serial
          ./internal/station
          ./internal/tftphelper
          ./internal/version
          ./internal/webprobe

      - name: Build Unix
        if: runner.os != 'Windows'
        run: go build -o dist/aruba-ap-to-iap-converter ./cmd/iap325-converter

      - name: Build Windows
        if: runner.os == 'Windows'
        run: go build -o dist/aruba-ap-to-iap-converter.exe ./cmd/iap325-converter
