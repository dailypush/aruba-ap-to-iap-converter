name: Release

on:
  push:
    tags:
      - "v*.*.*"
      - "v*.*.*-*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to stamp when running manually"
        required: true
        default: "0.1.0-dev"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            runner: macos-15
            suffix: macos-arm64
            extension: ""
          - name: macOS Intel
            runner: macos-15-intel
            suffix: macos-intel
            extension: ""
          - name: Windows
            runner: windows-latest
            suffix: windows-amd64
            extension: ".exe"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: Test Unix
        if: runner.os != 'Windows'
        run: go test ./...

      - name: Test Windows core
        if: runner.os == 'Windows'
        run: >
          go test -timeout 5m
          ./internal/config
          ./internal/converter
          ./internal/dhcphelper
          ./internal/firmware
          ./internal/inventory
          ./internal/parser
          ./internal/platform
          ./internal/serial
          ./internal/station
          ./internal/tftphelper
          ./internal/version
          ./internal/webprobe

      - name: Build release binary
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${{ inputs.version }}"
          fi

          COMMIT="$(git rev-parse --short HEAD)"
          BUILT_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          APP_NAME="aruba-ap-to-iap-converter"
          ASSET_NAME="${APP_NAME}-${VERSION}-${{ matrix.suffix }}"
          EXTENSION="${{ matrix.extension }}"

          mkdir -p "dist/${ASSET_NAME}"

          go build \
            -ldflags "-X github.com/dailypush/aruba-ap-to-iap-converter/internal/version.Version=${VERSION} -X github.com/dailypush/aruba-ap-to-iap-converter/internal/version.Commit=${COMMIT} -X github.com/dailypush/aruba-ap-to-iap-converter/internal/version.BuiltAt=${BUILT_AT}" \
            -o "dist/${ASSET_NAME}/${APP_NAME}${EXTENSION}" ./cmd/iap325-converter

          cp README.md LICENSE CHANGELOG.md "dist/${ASSET_NAME}/"
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            powershell -NoProfile -Command "Compress-Archive -Path 'dist/${ASSET_NAME}' -DestinationPath 'dist/${ASSET_NAME}.zip' -Force"
          else
            (cd dist && zip -r "${ASSET_NAME}.zip" "${ASSET_NAME}")
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: aruba-ap-to-iap-converter-${{ matrix.suffix }}
          path: dist/*.zip
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref_type == 'tag'

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          release_flags=()
          if [[ "${GITHUB_REF_NAME}" == *"-rc."* || "${GITHUB_REF_NAME}" == *"-alpha."* || "${GITHUB_REF_NAME}" == *"-beta."* ]]; then
            release_flags+=(--prerelease)
          fi

          gh release create "${GITHUB_REF_NAME}" dist/*.zip \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Aruba AP to IAP Converter ${GITHUB_REF_NAME#v}" \
            --notes "Release ${GITHUB_REF_NAME#v}" \
            "${release_flags[@]}"
